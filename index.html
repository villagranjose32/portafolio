<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>José Villagrán · Portafolio de Proyectos</title>
<style>
:root{--bg:#f6f4ff;--fg:#17142b;--mut:#5d5a7a;--card:rgba(255,255,255,.75);--bd:rgba(90,60,220,.16);--a:#7c3aed;--b:#06b6d4;--c:#f43f5e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a0919;--fg:#f1efff;--mut:#a29fc4;--card:rgba(255,255,255,.06);--bd:rgba(255,255,255,.12)}}
:root[data-theme="dark"]{--bg:#0a0919;--fg:#f1efff;--mut:#a29fc4;--card:rgba(255,255,255,.06);--bd:rgba(255,255,255,.12)}
*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.55;overflow-x:hidden}
.blob{position:fixed;border-radius:50%;filter:blur(90px);opacity:.45;z-index:-1;animation:fl 18s ease-in-out infinite alternate}
.b1{width:420px;height:420px;background:var(--a);top:-120px;left:-100px}
.b2{width:380px;height:380px;background:var(--b);top:30%;right:-120px;animation-delay:-6s}
.b3{width:340px;height:340px;background:var(--c);bottom:-120px;left:25%;animation-delay:-11s;opacity:.3}
@keyframes fl{to{transform:translate(60px,40px) scale(1.15)}}
.wrap{max-width:1100px;margin:0 auto;padding:0 20px}
nav{display:flex;justify-content:space-between;align-items:center;padding:20px 0}
.logo{font-weight:800;letter-spacing:-.5px}.logo span,.grad{background:linear-gradient(90deg,var(--a),var(--b),var(--c));-webkit-background-clip:text;background-clip:text;color:transparent}
.btn{border:1px solid var(--bd);background:var(--card);color:var(--fg);padding:10px 18px;border-radius:999px;font:600 14px inherit;cursor:pointer;text-decoration:none;display:inline-flex;gap:6px;align-items:center;backdrop-filter:blur(10px);transition:transform .2s,box-shadow .2s}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(124,58,237,.3)}
.btn.pri{background:linear-gradient(90deg,var(--a),var(--b));color:#fff;border:0}
.btn.sm{padding:7px 14px;font-size:13px}.btn.del{color:var(--c)}
#hero{padding:50px 0 50px;display:grid;grid-template-columns:1fr auto;gap:40px;align-items:center}
.ph{position:relative;width:clamp(210px,28vw,300px);aspect-ratio:1;border-radius:50%;padding:6px;background:conic-gradient(from 0deg,var(--a),var(--b),var(--c),var(--a));animation:sp 8s linear infinite;box-shadow:0 0 70px rgba(124,58,237,.45)}
.ph img{width:100%;height:100%;border-radius:50%;object-fit:cover;object-position:center 20%;border:5px solid var(--bg);display:block;animation:sp 8s linear infinite reverse}
@keyframes sp{to{transform:rotate(360deg)}}
@media(max-width:760px){#hero{grid-template-columns:1fr;text-align:center;justify-items:center}#hero .cta{justify-content:center}.ph{order:-1}}
.tag{display:inline-block;padding:6px 14px;border:1px solid var(--bd);border-radius:999px;background:var(--card);font-size:13px;color:var(--mut)}
h1{font-size:clamp(38px,8vw,78px);line-height:1.02;margin:18px 0;letter-spacing:-2px}
.role{font-size:clamp(18px,3vw,26px);font-weight:600;min-height:1.6em}
.role:after{content:"|";animation:bl 1s steps(1) infinite;color:var(--b)}@keyframes bl{50%{opacity:0}}
.bio{max-width:620px;color:var(--mut);font-size:17px}
.cta{display:flex;gap:12px;flex-wrap:wrap;margin-top:26px}
h2{font-size:30px;margin:30px 0 6px;letter-spacing:-1px}
#filters{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0 24px}
.chip{cursor:pointer;border:1px solid var(--bd);background:var(--card);color:var(--fg);border-radius:999px;padding:7px 16px;font:600 13px inherit}
.chip.on{background:var(--fg);color:var(--bg)}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:22px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:22px;overflow:hidden;backdrop-filter:blur(14px);transition:transform .3s,box-shadow .3s;display:flex;flex-direction:column;animation:up .6s both}
.card:hover{transform:translateY(-8px) rotate(-.4deg);box-shadow:0 24px 50px -12px rgba(124,58,237,.45)}
@keyframes up{from{opacity:0;transform:translateY(24px)}}
.cover{height:150px;display:grid;place-items:center;font-size:62px;position:relative}
.cover.im{height:auto;aspect-ratio:16/9;overflow:hidden;background:#0a0919}.cover.im img{width:100%;height:100%;object-fit:cover;transition:transform .5s}.card:hover .cover.im img{transform:scale(1.07)}
.cover small{position:absolute;top:12px;left:12px;background:rgba(0,0,0,.35);color:#fff;font-size:11px;padding:3px 10px;border-radius:99px;backdrop-filter:blur(6px)}
.body{padding:18px 20px 20px;display:flex;flex-direction:column;gap:10px;flex:1}
.body h3{margin:0;font-size:20px}.body p{margin:0;color:var(--mut);font-size:14.5px;flex:1}
.tech{display:flex;flex-wrap:wrap;gap:6px}.tech span{font-size:12px;padding:3px 10px;border-radius:99px;background:rgba(124,58,237,.16);color:var(--a);font-weight:600}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.empty{padding:40px;text-align:center;color:var(--mut);border:2px dashed var(--bd);border-radius:20px;grid-column:1/-1}
.glass{background:var(--card);border:1px solid var(--bd);border-radius:22px;padding:24px;backdrop-filter:blur(14px)}
.about{display:grid;grid-template-columns:1.4fr 1fr;gap:22px;margin-top:14px}@media(max-width:760px){.about{grid-template-columns:1fr}}
.about p{margin:0 0 12px;color:var(--mut)}.about p:last-child{margin:0}
.tl{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px;margin-top:14px}
.ed{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:18px;transition:transform .3s;position:relative}.ed:hover{transform:translateY(-5px)}
.ed .ic{font-size:30px}.ed b{display:block;margin:6px 0 2px}.ed small{color:var(--mut)}.ed .yr{position:absolute;top:16px;right:16px;font-size:12px;font-weight:700;color:var(--a)}
.loc{margin:0 0 4px}
footer{padding:50px 0 40px;text-align:center;color:var(--mut);font-size:14px}
footer .links{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:14px}
dialog{border:1px solid var(--bd);border-radius:22px;background:var(--bg);color:var(--fg);width:min(520px,94vw);padding:24px;max-height:90vh}
dialog::backdrop{background:rgba(5,4,20,.65);backdrop-filter:blur(4px)}
dialog h3{margin:0 0 14px}label{display:block;font-size:12px;font-weight:700;color:var(--mut);margin:10px 0 4px}
input,textarea,select{width:100%;padding:10px 12px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--fg);font:15px inherit}
textarea{min-height:76px;resize:vertical}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mact{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
#toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:99px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .3s}
#toast.on{opacity:1}
</style>
</head>

<script>
const S=JSON.parse(document.getElementById('data').textContent);
let canEdit=false,art=null,filter='Todos',roleI=0,timer=null;
const $=s=>document.querySelector(s);
const url=u=>/^https?:\/\//i.test((u||'').trim())?u.trim():'';
function h(t,a,...k){const e=document.createElement(t);for(const x in a||{}){x==='class'?e.className=a[x]:x.startsWith('on')?e.addEventListener(x.slice(2),a[x]):e.setAttribute(x,a[x])}k.flat().forEach(c=>e.append(c));return e}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),2800)}
function link(txt,u,cls){return h('a',{class:'btn '+cls,href:u,target:'_blank',rel:'noopener noreferrer'},txt)}

function renderHero(){
 const p=S.profile,hero=$('#hero'),bar=$('#bar');hero.innerHTML='';bar.innerHTML='';
 const r=h('div',{class:'role'});
 const L=h('div',{class:'hl'});L.append(h('span',{class:'tag'},'📍 '+(p.location||'Bienvenido a mi portafolio')),h('h1',{},'Hola, soy ',h('span',{class:'grad'},p.name.split(' ').slice(0,1).join(' ')),' ',p.name.split(' ').slice(1).join(' ')),r,h('p',{class:'bio'},p.bio),
  h('div',{class:'cta'},h('a',{class:'btn pri',href:'#proyectos'},'Ver proyectos ↓'),p.email?h('a',{class:'btn',href:'mailto:'+p.email},'✉️ Contáctame'):'',url(p.github)?link('GitHub ↗',p.github,''):''));
 hero.append(L);
 if(/^data:image\/(jpeg|png|webp);base64,/.test(p.photo||''))hero.append(h('div',{class:'ph'},h('img',{src:p.photo,alt:'Foto de '+p.name})));
 clearInterval(timer);const roles=p.roles.length?p.roles:[''];let i=0,c=0,del=false;
 timer=setInterval(()=>{const w=roles[i%roles.length];c+=del?-1:1;r.textContent=w.slice(0,c);if(!del&&c>=w.length+12)del=true;if(del&&c<=0){del=false;i++}},70);
 if(canEdit){bar.append(h('button',{class:'btn sm',onclick:profileDlg},'✏️ Perfil'),' ',h('button',{class:'btn sm pri',onclick:()=>projDlg()},'+ Agregar proyecto'))}
}
function renderGrid(){
 const cats=['Todos',...new Set(S.projects.map(p=>p.cat).filter(Boolean))];if(!cats.includes(filter))filter='Todos';
 const f=$('#filters');f.innerHTML='';cats.forEach(c=>f.append(h('button',{class:'chip'+(c===filter?' on':''),onclick:()=>{filter=c;renderGrid()}},c)));
 const g=$('#grid');g.innerHTML='';
 const list=S.projects.filter(p=>filter==='Todos'||p.cat===filter);
 if(!list.length)g.append(h('div',{class:'empty'},canEdit?'Aún no hay proyectos. Pulsa “+ Agregar proyecto”.':'Pronto habrá proyectos aquí.'));
 list.forEach((p,i)=>{
  const hue=+p.hue||265,d=url(p.demo),c=url(p.code);
  const card=h('article',{class:'card',style:'animation-delay:'+i*70+'ms'},
   (()=>{const ok=/^data:image\/(jpeg|png|webp);base64,/.test(p.img||'');return h('div',{class:'cover'+(ok?' im':''),style:ok?'':`background:linear-gradient(135deg,hsl(${hue} 80% 55%),hsl(${(hue+60)%360} 85% 50%))`},ok?h('img',{src:p.img,alt:p.title,loading:'lazy'}):'',h('small',{},p.cat||'Proyecto'),ok?'':(p.emoji||'🚀'))})(),
   h('div',{class:'body'},h('h3',{},p.title),h('p',{},p.desc),h('div',{class:'tech'},(p.tech||[]).map(t=>h('span',{},t))),
    h('div',{class:'acts'},d?link('▶ Ver demo',d,'pri sm'):'',c?link('</> Código',c,'sm'):'',(p.extra||[]).filter(x=>url(x.u)).map(x=>link(x.l,x.u,'sm')),
     canEdit?[h('button',{class:'btn sm',onclick:()=>projDlg(p)},'Editar'),h('button',{class:'btn sm del',onclick:()=>del(p.id)},'Eliminar')]:'')));
  g.append(card)});
}
function renderAbout(){
 const p=S.profile,a=$('#about');a.innerHTML='';
 a.append(h('h2',{},'Perfil ',h('span',{class:'grad'},'profesional')),
  h('div',{class:'about'},h('div',{class:'glass'},(p.about||[]).map(t=>h('p',{},t))),
   h('div',{class:'glass'},h('b',{},'Áreas de trabajo'),h('div',{class:'tech',style:'margin-top:12px'},(p.skills||[]).map(t=>h('span',{},t))))))}
function renderEdu(){
 const e=$('#edu');e.innerHTML='';
 e.append(h('h2',{},'Forma',h('span',{class:'grad'},'ción')),
  h('div',{class:'tl'},(S.profile.edu||[]).map(x=>h('div',{class:'ed'},h('div',{class:'ic'},x.e||'🎓'),x.y?h('span',{class:'yr'},x.y):'',h('b',{},x.t),x.w?h('small',{},x.w):''))))}
function renderFoot(){
 const p=S.profile,f=$('#foot');f.innerHTML='';
 const l=h('div',{class:'links'});
 if(url(p.github))l.append(link('GitHub',p.github,'sm'));if(url(p.linkedin))l.append(link('LinkedIn',p.linkedin,'sm'));if(p.email)l.append(h('a',{class:'btn sm',href:'mailto:'+p.email},'✉️ '+p.email));
 if(p.phone){const d=p.phone.replace(/\D/g,'');l.append(h('a',{class:'btn sm',href:'tel:+54'+d},'📞 '+p.phone),link('💬 WhatsApp','https://wa.me/549'+d,'sm'))}
 if(url(p.oldsite))l.append(link('Portafolio anterior','' + p.oldsite,'sm'));
 f.append(l,h('div',{},'© '+new Date().getFullYear()+' '+p.name+' · Hecho con 💜'));
}
function renderAll(){renderHero();renderAbout();renderEdu();renderGrid();renderFoot()}

function field(id,lab,val,type){const i=type==='area'?h('textarea',{id}):h('input',{id,type:'text'});i.value=val||'';return [h('label',{for:id},lab),i]}
function open(title,fields,onOk){
 const b=$('#dbody');b.innerHTML='';
 b.append(h('h3',{},title),...fields.flat(),h('div',{class:'mact'},h('button',{class:'btn',onclick:()=>$('#dlg').close()},'Cancelar'),h('button',{class:'btn pri',onclick:()=>{if(onOk()!==false)$('#dlg').close()}},'Guardar')));
 $('#dlg').showModal()}
const v=id=>$('#'+id).value.trim();
function projDlg(p){
 let nimg=null;const n=!p;p=p||{hue:265,emoji:'🚀',cat:'Web',tech:[]};
 const sel=h('select',{id:'f_cat'});['Web','Móvil','Backend','Escritorio','IA / Datos','Juegos','Otro'].forEach(o=>{const op=h('option',{},o);if(o===p.cat)op.selected=true;sel.append(op)});
 open(n?'Nuevo proyecto':'Editar proyecto',[
  field('f_title','Nombre del proyecto',p.title),field('f_desc','Descripción',p.desc,'area'),
  field('f_tech','Tecnologías (separadas por coma)',(p.tech||[]).join(', ')),
  field('f_demo','Enlace a la demo (https://…)',p.demo),field('f_code','Enlace al código (opcional)',p.code),
  [h('div',{class:'row'},h('div',{},h('label',{for:'f_cat'},'Categoría'),sel),h('div',{},...field('f_emoji','Emoji de portada',p.emoji)))],
  field('f_hue','Color (0–360)',String(p.hue)),[h('label',{},'Portada (imagen opcional)'),h('input',{type:'file',accept:'image/*',onchange:e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const w=Math.min(720,im.width),c=document.createElement('canvas');c.width=w;c.height=Math.round(im.height*w/im.width);c.getContext('2d').drawImage(im,0,0,c.width,c.height);nimg=c.toDataURL('image/jpeg',.74)};im.src=r.result};r.readAsDataURL(f)}})]],()=>{
  if(!v('f_title')){toast('Falta el nombre');return false}
  const d=v('f_demo'),c=v('f_code');
  if((d&&!url(d))||(c&&!url(c))){toast('Los enlaces deben empezar con http:// o https://');return false}
  const o=Object.assign({},p,{id:p.id||'p'+Date.now(),img:nimg||p.img||'',title:v('f_title'),desc:v('f_desc'),tech:v('f_tech').split(',').map(s=>s.trim()).filter(Boolean),demo:d,code:c,cat:$('#f_cat').value,emoji:v('f_emoji')||'🚀',hue:Math.max(0,Math.min(360,+v('f_hue')||265))});
  if(n)S.projects.unshift(o);else S.projects[S.projects.findIndex(x=>x.id===p.id)]=o;save()})}
function del(id){if(confirm('¿Eliminar este proyecto?')){S.projects=S.projects.filter(p=>p.id!==id);save()}}
function profileDlg(){const p=S.profile;
 open('Mi perfil',[field('p_name','Nombre',p.name),field('p_roles','Roles (separados por coma)',p.roles.join(', ')),field('p_bio','Sobre mí',p.bio,'area'),field('p_gh','GitHub (URL)',p.github),field('p_li','LinkedIn (URL)',p.linkedin),field('p_em','Email',p.email),field('p_ph','Teléfono',p.phone),field('p_loc','Ubicación',p.location)],()=>{
  Object.assign(p,{name:v('p_name')||'José Esteban Villagrán',roles:v('p_roles').split(',').map(s=>s.trim()).filter(Boolean),bio:v('p_bio'),github:url(v('p_gh')),linkedin:url(v('p_li')),email:v('p_em'),phone:v('p_ph'),location:v('p_loc')});save()})}

let pend=null;
function save(){renderAll();clearTimeout(pend);pend=setTimeout(async()=>{
 if(!art){toast('Vista previa: publica la página para guardar los cambios');return}
 try{const c=document.documentElement.cloneNode(true);
  c.querySelector('#data').textContent=JSON.stringify(S).replace(/</g,'\\u003c');
  c.querySelectorAll('[data-r]').forEach(e=>e.innerHTML='');c.querySelector('#dbody').innerHTML='';c.querySelector('#toast').className='';c.querySelector('#toast').textContent='';
  await art.publish('<!doctype html>\n'+c.outerHTML);
 }catch(e){toast('No se pudo guardar: '+(e&&e.code||'error'))}},600)}

(async()=>{
 renderAll();
 try{if(window.claude){const u=await claude.use('user');art=await claude.use('artifact');canEdit=!!(u&&u.isOwner());}else canEdit=false}catch(e){}
 renderAll();
})();
